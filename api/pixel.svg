  <!-- Purple Mushroom Coral -->
  <g transform="translate(480, 288)">
    <rect x="-10" y="0" width="20" height="6" fill="#a855f7" />
    <rect x="-14" y="2" width="28" height="4" fill="#c084fc" />
    <rect x="-4" y="6" width="8" height="12" fill="#7e22ce" />
  </g>
