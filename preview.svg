<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 400" width="100%" height="100%">
  <defs>
    <!-- Ocean Background Gradient -->
    <linearGradient id="oceanGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0a1226" />
      <stop offset="35%" stop-color="#0d1b3a" />
      <stop offset="70%" stop-color="#0a1835" />
      <stop offset="100%" stop-color="#050a18" />
    </linearGradient>

    <!-- Water Surface Light Beam -->
    <linearGradient id="lightBeam" x1="50%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.25" />
      <stop offset="40%" stop-color="#0ea5e9" stop-opacity="0.08" />
      <stop offset="100%" stop-color="#0ea5e9" stop-opacity="0" />
    </linearGradient>

    <!-- Sandy Floor Gradient -->
    <linearGradient id="sandGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#14213d" />
      <stop offset="100%" stop-color="#080e1e" />
    </linearGradient>

    <!-- Jellyfish Dome Gradient -->
    <radialGradient id="jellyDome" cx="50%" cy="40%" r="50%">
      <stop offset="0%" stop-color="#a5f3fc" stop-opacity="0.9" />
      <stop offset="60%" stop-color="#38bdf8" stop-opacity="0.6" />
      <stop offset="100%" stop-color="#0284c7" stop-opacity="0.2" />
    </radialGradient>

    <!-- Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <style>
    /* Swaying Kelp Animation */
    .kelp-1 {
      transform-origin: 120px 400px;
      animation: sway 5s ease-in-out infinite alternate;
    }
    .kelp-2 {
      transform-origin: 150px 400px;
      animation: sway 6s ease-in-out infinite alternate-reverse;
    }
    .kelp-3 {
      transform-origin: 730px 400px;
      animation: sway 4.5s ease-in-out infinite alternate;
    }
    .kelp-4 {
      transform-origin: 760px 400px;
      animation: sway 5.5s ease-in-out infinite alternate-reverse;
    }

    @keyframes sway {
      0% { transform: rotate(-5deg); }
      100% { transform: rotate(6deg); }
    }

    /* Bubble Rising Animation */
    .bubble {
      animation: rise 6s linear infinite;
    }
    .b1 { animation-delay: 0s; animation-duration: 5.5s; }
    .b2 { animation-delay: 1.5s; animation-duration: 6.8s; }
    .b3 { animation-delay: 3s; animation-duration: 5.2s; }
    .b4 { animation-delay: 4.2s; animation-duration: 7.1s; }
    .b5 { animation-delay: 2.1s; animation-duration: 6.2s; }

    @keyframes rise {
      0% { transform: translateY(0) translateX(0); opacity: 0; }
      15% { opacity: 0.7; }
      50% { transform: translateY(-180px) translateX(6px); opacity: 0.6; }
      85% { opacity: 0.4; }
      100% { transform: translateY(-380px) translateX(-4px); opacity: 0; }
    }

    /* Type Jellyfish Bobbing */
    .jellyfish {
      animation: jellyPropel 4.5s ease-in-out infinite alternate;
    }
    @keyframes jellyPropel {
      0% { transform: translate(380px, 190px) scale(1, 1); }
      20% { transform: translate(385px, 140px) scale(0.92, 1.12); }
      50% { transform: translate(395px, 120px) scale(1.05, 0.95); }
      80% { transform: translate(405px, 160px) scale(0.98, 1.02); }
      100% { transform: translate(410px, 190px) scale(1, 1); }
    }

    /* Tentacle Wave */
    .tentacle {
      animation: tentacleWave 2.5s ease-in-out infinite alternate;
      transform-origin: top center;
    }
    @keyframes tentacleWave {
      0% { transform: rotate(-6deg); }
      100% { transform: rotate(6deg); }
    }

    /* Neon Tetra 1 Swimming */
    .fish-1 {
      animation: fishTrack1 18s linear infinite;
    }
    @keyframes fishTrack1 {
      0% { transform: translate(80px, 130px) scale(1, 1); }
      48% { transform: translate(680px, 150px) scale(1, 1); }
      50% { transform: translate(680px, 150px) scale(-1, 1); }
      98% { transform: translate(80px, 110px) scale(-1, 1); }
      100% { transform: translate(80px, 130px) scale(1, 1); }
    }

    /* Neon Tetra 2 Swimming */
    .fish-2 {
      animation: fishTrack2 22s linear infinite;
    }
    @keyframes fishTrack2 {
      0% { transform: translate(620px, 240px) scale(-1, 1); }
      48% { transform: translate(120px, 220px) scale(-1, 1); }
      50% { transform: translate(120px, 220px) scale(1, 1); }
      98% { transform: translate(620px, 260px) scale(1, 1); }
      100% { transform: translate(620px, 240px) scale(-1, 1); }
    }

    /* Neon Tetra 3 Swimming */
    .fish-3 {
      animation: fishTrack3 15s linear infinite;
    }
    @keyframes fishTrack3 {
      0% { transform: translate(250px, 285px) scale(0.85, 0.85); }
      48% { transform: translate(720px, 275px) scale(0.85, 0.85); }
      50% { transform: translate(720px, 275px) scale(-0.85, 0.85); }
      98% { transform: translate(250px, 305px) scale(-0.85, 0.85); }
      100% { transform: translate(250px, 285px) scale(0.85, 0.85); }
    }
  </style>

  <!-- Background -->
  <rect width="850" height="400" rx="16" fill="url(#oceanGrad)" stroke="#1e293b" stroke-width="2" />

  <!-- Ambient Light Rays -->
  <polygon points="180,0 280,0 360,400 120,400" fill="url(#lightBeam)" />
  <polygon points="450,0 550,0 660,400 400,400" fill="url(#lightBeam)" />

  <!-- Sandy Seabed -->
  <path d="M 0,345 Q 160,335 320,350 T 640,340 T 850,355 L 850,400 L 0,400 Z" fill="url(#sandGrad)" />
  <path d="M 0,360 Q 200,350 450,365 T 850,360 L 850,400 L 0,400 Z" fill="#040711" opacity="0.6" />

  <!-- Seabed Pebbles -->
  <circle cx="180" cy="375" r="4" fill="#334155" opacity="0.6" />
  <circle cx="210" cy="382" r="3" fill="#1e293b" opacity="0.8" />
  <circle cx="520" cy="380" r="5" fill="#334155" opacity="0.5" />
  <circle cx="680" cy="378" r="3.5" fill="#1e293b" opacity="0.7" />

  <!-- Left Kelp / Seaweed -->
  <g class="kelp-1">
    <path d="M 120,400 Q 105,320 125,260 T 110,180 Q 105,140 120,110" fill="none" stroke="#059669" stroke-width="5" stroke-linecap="round" opacity="0.85" />
    <path d="M 120,400 Q 105,320 125,260 T 110,180 Q 105,140 120,110" fill="none" stroke="#34d399" stroke-width="2" stroke-linecap="round" opacity="0.6" />
  </g>
  <g class="kelp-2">
    <path d="M 145,400 Q 165,330 140,270 T 160,190 Q 165,150 150,130" fill="none" stroke="#047857" stroke-width="6" stroke-linecap="round" opacity="0.7" />
  </g>

  <!-- Right Kelp / Seaweed -->
  <g class="kelp-3">
    <path d="M 735,400 Q 755,330 730,260 T 750,170 Q 745,130 735,100" fill="none" stroke="#059669" stroke-width="5" stroke-linecap="round" opacity="0.8" />
  </g>
  <g class="kelp-4">
    <path d="M 765,400 Q 745,340 770,280 T 755,200 Q 760,160 775,125" fill="none" stroke="#065f46" stroke-width="6" stroke-linecap="round" opacity="0.65" />
  </g>

  <!-- Floating Bubbles -->
  <g transform="translate(130, 370)">
    <circle class="bubble b1" cx="0" cy="0" r="3" fill="#bae6fd" />
  </g>
  <g transform="translate(240, 360)">
    <circle class="bubble b2" cx="0" cy="0" r="4.5" fill="#bae6fd" />
  </g>
  <g transform="translate(480, 370)">
    <circle class="bubble b3" cx="0" cy="0" r="2.5" fill="#bae6fd" />
  </g>
  <g transform="translate(620, 365)">
    <circle class="bubble b4" cx="0" cy="0" r="3.5" fill="#bae6fd" />
  </g>
  <g transform="translate(740, 375)">
    <circle class="bubble b5" cx="0" cy="0" r="4" fill="#bae6fd" />
  </g>

  <!-- 🪼 TypeScript Jellyfish -->
  <g class="jellyfish" filter="url(#glow)">
    <!-- Jellyfish Dome -->
    <path d="M -28,0 C -28,-26 28,-26 28,0 C 20,4 12,2 0,3 C -12,2 -20,4 -28,0 Z" fill="url(#jellyDome)" stroke="#38bdf8" stroke-width="1.5" />
    
    <!-- TypeScript Badge inside Dome -->
    <rect x="-9" y="-18" width="18" height="13" rx="2.5" fill="#0284c7" />
    <text x="0" y="-8" font-family="'Courier New', monospace, sans-serif" font-size="8.5" font-weight="900" fill="#ffffff" text-anchor="middle">TS</text>

    <!-- Tentacles -->
    <g class="tentacle">
      <path d="M -16,2 Q -20,18 -14,35 T -16,55" fill="none" stroke="#38bdf8" stroke-width="1.5" stroke-linecap="round" opacity="0.8" />
      <path d="M -6,3 Q -10,22 -3,42 T -5,62" fill="none" stroke="#7dd3fc" stroke-width="1.8" stroke-linecap="round" opacity="0.9" />
      <path d="M 6,3 Q 2,22 9,42 T 7,62" fill="none" stroke="#7dd3fc" stroke-width="1.8" stroke-linecap="round" opacity="0.9" />
      <path d="M 16,2 Q 20,18 14,35 T 16,55" fill="none" stroke="#38bdf8" stroke-width="1.5" stroke-linecap="round" opacity="0.8" />
    </g>
  </g>

  <!-- 🐟 Neon Tetra 1 -->
  <g class="fish-1" filter="url(#glow)">
    <!-- Body -->
    <path d="M 18,0 Q 4,-7 -12,-4 L -18,-8 L -16,0 L -18,8 L -12,4 Q 4,7 18,0 Z" fill="#0f172a" stroke="#0284c7" stroke-width="1" />
    <!-- Cyan Neon Stripe -->
    <path d="M 16,-1 Q 2,-4 -12,-2" fill="none" stroke="#00f0ff" stroke-width="2.5" stroke-linecap="round" />
    <!-- Red Accent Stripe -->
    <path d="M 2,1 Q -6,3 -14,2" fill="none" stroke="#ff0055" stroke-width="2" stroke-linecap="round" />
    <!-- Eye -->
    <circle cx="12" cy="-2" r="1.5" fill="#ffffff" />
    <circle cx="13" cy="-2" r="0.8" fill="#000000" />
    <!-- Fin -->
    <polygon points="-4,2 -1,6 3,2" fill="#38bdf8" opacity="0.7" />
  </g>

  <!-- 🐟 Neon Tetra 2 -->
  <g class="fish-2" filter="url(#glow)">
    <path d="M 18,0 Q 4,-7 -12,-4 L -18,-8 L -16,0 L -18,8 L -12,4 Q 4,7 18,0 Z" fill="#0f172a" stroke="#0284c7" stroke-width="1" />
    <path d="M 16,-1 Q 2,-4 -12,-2" fill="none" stroke="#38bdf8" stroke-width="2.5" stroke-linecap="round" />
    <path d="M 2,1 Q -6,3 -14,2" fill="none" stroke="#f43f5e" stroke-width="2" stroke-linecap="round" />
    <circle cx="12" cy="-2" r="1.5" fill="#ffffff" />
    <circle cx="13" cy="-2" r="0.8" fill="#000000" />
    <polygon points="-4,2 -1,6 3,2" fill="#38bdf8" opacity="0.7" />
  </g>

  <!-- 🐟 Neon Tetra 3 (Smaller) -->
  <g class="fish-3" filter="url(#glow)">
    <path d="M 18,0 Q 4,-7 -12,-4 L -18,-8 L -16,0 L -18,8 L -12,4 Q 4,7 18,0 Z" fill="#0f172a" stroke="#0284c7" stroke-width="1" />
    <path d="M 16,-1 Q 2,-4 -12,-2" fill="none" stroke="#22d3ee" stroke-width="2.2" stroke-linecap="round" />
    <path d="M 2,1 Q -6,3 -14,2" fill="none" stroke="#fb7185" stroke-width="1.8" stroke-linecap="round" />
    <circle cx="12" cy="-2" r="1.5" fill="#ffffff" />
    <circle cx="13" cy="-2" r="0.8" fill="#000000" />
  </g>

  <!-- HUD: Top Left Header -->
  <g transform="translate(24, 24)">
    <rect width="210" height="42" rx="10" fill="#090d1a" fill-opacity="0.75" stroke="#1e293b" stroke-width="1.2" />
    <text x="14" y="22" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="800" fill="#f8fafc">🐠 GitQuarium</text>
    <text x="14" y="34" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9.5" font-weight="500" fill="#94a3b8">@dahee90522's Live Tank</text>
  </g>

  <!-- HUD: Top Right Stats -->
  <g transform="translate(630, 24)">
    <rect width="196" height="42" rx="10" fill="#090d1a" fill-opacity="0.75" stroke="#1e293b" stroke-width="1.2" />
    <circle cx="16" cy="21" r="4" fill="#10b981" />
    <text x="26" y="19" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10.5" font-weight="700" fill="#e2e8f0">8 Commits (7d)</text>
    <text x="26" y="32" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9" font-weight="500" fill="#38bdf8">4 Fishes Swimming</text>
  </g>

  <!-- Watermark Bottom Right -->
  <g transform="translate(650, 375)">
    <text x="175" y="12" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9" font-weight="500" fill="#475569" text-anchor="end">Powered by project-hh-com/gitquarium</text>
  </g>
</svg>
